<!DOCTYPE html>
<html>
    <head>
        <title>Formulário</title>
    </head>
    <body>
        <style>
            .estiloClasse{
                color: green;
                text-align: left;
                font-size: 20px;
            }
            #estiloId{
                color: blue;
                text-align: center;
            }
        </style>
        <h1 id="estiloId">MEUS FILMES</h1>
        <h2 class="estiloClasse">Animação</h2>
        <p> Filmes de ação são aqueles onde a história conta...</p>
        <p> São meus filmes preferidos: </p>
        <ol>
            <li><a href="minions.html">Minions</a></li>
            <img src="imagens/minions.jpg" alt="Minions" width="250"><br>
        </ol>
        <h2 class="estiloClasse">Romance</h2>
        <p> Filmes de romance são aqueles onde a história conta...</p>
        <p> São meus filmes preferidos: </p>
        <ol>
            <li><a href="crush.html">Crush</a></li>
            <img src="imagens/crush.jpg" alt="Crush" width="250"><br>
        </ol>
        <form>
            <label for="Nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome"><br><br>
            <label for="Data de nascimento">Data de nascimento:</label>
            <input type="date" id="nasc"><br><br>
            <label>Gênero:</label>
            <label for="masc">Masculino:</label>
            <input type="radio" id="masc" value="Masculino" name="genero">
            <label for="fem">Feminino:</label>
            <input type="radio" id="fem" value="Feminino" name="genero"> <br><br>
            <label for="horario">Horário:</label>
            <input type="time" id="horario"><br><br>
            <label for="avisar">Lembrar do atendimento:</label>
            <input type="checkbox" id="avisar"><br><br>
        </form>
    </body>
